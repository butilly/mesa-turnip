name: Upstream sync

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: turnip
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Mirror upstream Mesa main to upstream-main
        run: |
          git fetch --no-tags https://gitlab.freedesktop.org/mesa/mesa.git main
          git push --force origin FETCH_HEAD:refs/heads/upstream-main
          git fetch --no-tags origin +upstream-main:refs/remotes/origin/upstream-main

      - name: Open or update the sync PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          count=$(git rev-list --count origin/turnip..origin/upstream-main)
          if [ "$count" -eq 0 ]; then
            echo "turnip already contains upstream-main"
            exit 0
          fi
          head=$(git rev-parse --short origin/upstream-main)
          subject=$(git log -1 --format=%s origin/upstream-main)
          body=$(printf 'upstream-main has %s commits that are not in turnip.\n\nNewest upstream commit: %s %s\n\nMerge this PR with a merge commit (not squash or rebase) so that turnip keeps the upstream history.' "$count" "$head" "$subject")
          pr=$(gh pr list --head upstream-main --base turnip --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body "$body"
          else
            gh pr create --head upstream-main --base turnip --title "Sync with upstream Mesa main" --body "$body"
          fi

  sync-gen8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: turnip
          fetch-depth: 1
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Mirror whitebelyash/mesa-unified turnip/gen8 to turnip-gen8 with the Turnip CI on top
        run: |
          git fetch --no-tags https://github.com/whitebelyash/mesa-unified.git turnip/gen8
          git checkout -q --detach FETCH_HEAD
          git checkout refs/remotes/origin/turnip -- .github/workflows/turnip.yml ci patches variants
          git -c user.name=turnip-ci -c user.email=turnip-ci@users.noreply.github.com commit -qm "Add the Turnip CI (workflow, ci/, patches/, variants/) to the gen8 branch"
          git push --force origin HEAD:refs/heads/turnip-gen8
